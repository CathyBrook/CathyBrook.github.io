name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: true
          lycheeVersion: v0.24.2
          # Ignore template documentation, sample posts, and pages with unrendered Liquid.
          # Their rendered output is covered by broken-links-site.yml after deployment.
          args: >-
            --user-agent 'curl/7.54'
            --root-dir .
            --exclude-path _site
            --exclude-path README.md
            --exclude-path FAQ.md
            --exclude-path INSTALL.md
            --exclude-path _pages/404.md
            --exclude-path _pages/about_einstein.md
            --exclude-path _pages/blog.md
            --exclude-path _pages/people.md
            --exclude-path _posts/2015-05-15-images.md
            --exclude-path _posts/2015-07-15-code.md
            --exclude-path _posts/2015-10-20-math.md
            --exclude-path _posts/2018-12-22-distill.md
            --exclude-path _posts/2023-04-24-videos.md
            --exclude-path _posts/2023-05-12-custom-blockquotes.md
            --exclude-path _posts/2024-01-27-advanced-images.md
            --exclude-path _posts/2024-12-04-photo-gallery.md
            --exclude-path _books/the_godfather.md
            --verbose --no-progress './**/*.md' './**/*.html'
